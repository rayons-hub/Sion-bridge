
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SION | WEB3 REAL-TIME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background-color: #000; color: #eee; font-family: 'Consolas', monospace; }
        .panel { background: #080808; border: 1px solid #1a1a1a; border-radius: 8px; }
        .btn-web3 { background: #0055ff; transition: 0.3s; }
        .btn-web3:active { transform: scale(0.98); background: #00ffcc; color: #000; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body class="p-5 flex flex-col min-h-screen">

    <div class="flex justify-between text-[10px] font-bold mb-8 uppercase">
        <span id="network-status" class="text-zinc-500"><span class="status-dot bg-red-600"></span> Desconectado</span>
        <span class="text-zinc-700">CHAIN ID: 771999</span>
    </div>

    <div class="panel p-5 mb-6">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs text-blue-500 font-black">SALDO EM VESTING (ELITE)</span>
            <span class="text-xl font-black text-white">$ 14.85</span>
        </div>
        <div id="wallet-address" class="text-[9px] text-zinc-600 truncate mb-4">Aguardando autorização do CEO...</div>
        <div class="h-[1px] bg-zinc-900 w-full mb-4"></div>
        <div class="flex justify-between text-xs">
            <span class="text-zinc-400 font-bold">Saldo Disponível:</span>
            <span id="real-balance" class="text-[#00ffcc] font-black">0.00 ETH/BNB</span>
        </div>
    </div>

    <div class="mt-auto space-y-4">
        <button id="connectBtn" onclick="conectarCarteira()" class="w-full py-4 text-[10px] font-bold uppercase border border-blue-500 text-blue-500 rounded">
            Conectar Carteira Mestre
        </button>

        <button id="liquidarBtn" onclick="executarSaqueReal()" disabled class="btn-web3 w-full py-6 text-sm font-black uppercase tracking-widest rounded opacity-30">
            Liquidar para Carteira
        </button>
        
        <div class="flex justify-between text-[9px] uppercase text-zinc-800 font-bold px-1">
            <button onclick="verificarIdentidade()">Soberania Oliveira</button>
            <span>Verisimilitude Lock: 100%</span>
        </div>
    </div>

    <script>
        let signer;

        async function conectarCarteira() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById('wallet-address').innerText = "CONECTADO: " + address;
                    document.getElementById('network-status').innerHTML = '<span class="status-dot bg-green-500"></span> MODO ONLINE';
                    document.getElementById('connectBtn').classList.add('hidden');
                    document.getElementById('liquidarBtn').disabled = false;
                    document.getElementById('liquidarBtn').classList.remove('opacity-30');
                    
                    const balance = await provider.getBalance(address);
                    document.getElementById('real-balance').innerText = ethers.formatEther(balance).slice(0, 6) + " NATIVO";
                    
                } catch (err) {
                    alert("Erro ao conectar: " + err.message);
                }
            } else {
                alert("Por favor, use o navegador da MetaMask ou Trust Wallet.");
            }
        }

        async function executarSaqueReal() {
            const btn = document.getElementById('liquidarBtn');
            btn.innerHTML = "ASSINANDO TRANSAÇÃO...";
            
            try {
                // Simulação de chamada ao Contrato SION para saque de ativos de elite
                // Na execução real, aqui vai a ABI do seu contrato de Vesting
                alert("SOLICITAÇÃO ENVIADA: Assine a transação na sua carteira para receber os $ 14.85.");
                
                // Exemplo de transação real (comente se for apenas teste de interface)
                /* const tx = await signer.sendTransaction({
                    to: "SEU_ENDEREÇO_DE_SAQUE",
                    value: ethers.parseEther("0.0") 
                }); */

                btn.innerHTML = "SAQUE CONCLUÍDO";
                btn.style.backgroundColor = "#00ffcc";
            } catch (err) {
                alert("Falha na assinatura: " + err.message);
                btn.innerHTML = "Liquidar para Carteira";
            }
        }

        function verificarIdentidade() {
            const p = prompt("SENHA VISUAL:");
            if(p && p.trim().toLowerCase() === "mudaram as estações") {
                alert("ACESSO OLIVEIRA CONFIRMADO. Herdeiros Iane e Rael mapeados.");
            }
        }
    </script>
</body>
</html>
