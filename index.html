
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SION | SOBERANIA TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #eee; font-family: 'Consolas', monospace; user-select: none; }
        .neon-border { border: 1px solid #1a1a1a; transition: 0.3s; }
        .neon-border:active { border-color: #00ffcc; }
        .btn-liquidar { background: #0055ff; box-shadow: 0 0 20px rgba(0, 85, 255, 0.3); }
        .btn-liquidar:active { background: #00ffcc; color: #000; }
        .scan-line { height: 2px; background: #0055ff; width: 100%; position: relative; overflow: hidden; }
        .scan-line::after { content: ""; position: absolute; width: 30%; height: 100%; background: #00ffcc; animation: slide 2s infinite; }
        @keyframes slide { from { left: -30%; } to { left: 100%; } }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <div class="flex justify-between text-[10px] font-bold mb-6">
        <span class="text-[#00ffcc]"><i class="fas fa-satellite-dish"></i> SENTINELA: ONLINE</span>
        <span class="text-zinc-600">ID: 771999</span>
    </div>

    <div class="space-y-4 flex-grow">
        
        <div class="bg-[#0a0a0a] p-4 neon-border rounded">
            <label class="text-[8px] text-zinc-500 uppercase font-black">Ultra-Sniper 360° Search</label>
            <div class="flex mt-2 gap-2">
                <input type="text" id="ca_input" placeholder="COLE O CONTRATO AQUI..." class="flex-grow bg-black border border-zinc-800 p-3 text-white outline-none text-xs">
                <button onclick="ativarSniper()" class="bg-zinc-900 px-4 text-[#00ffcc]"><i class="fas fa-bolt"></i></button>
            </div>
            <div id="status_sniper" class="text-[9px] mt-2 text-zinc-600 italic">Aguardando entrada de dados...</div>
        </div>

        <div class="bg-[#0a0a0a] p-4 neon-border rounded">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[8px] text-blue-500 font-black uppercase">Ativos de Elite</span>
                <span class="text-white font-black text-sm">$ 14.85</span>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between text-xs border-b border-zinc-900 pb-2">
                    <span class="font-bold">Fuel</span><span class="text-[#00ffcc]">$11.00</span>
                </div>
                <div class="flex justify-between text-xs border-b border-zinc-900 pb-2">
                    <span class="font-bold">Patex (L2)</span><span class="text-[#00ffcc]">$2.50</span>
                </div>
            </div>
            <div class="scan-line mt-4"></div>
        </div>

    </div>

    <div class="mt-auto pt-6 space-y-4">
        <button onclick="processarSaque()" id="btn_saque" class="btn-liquidar w-full py-5 text-xs font-black uppercase tracking-widest rounded">
            Liquidar Ativos Agora
        </button>
        
        <div class="flex justify-between text-[9px] px-2">
            <button onclick="liberarOliveira()" class="text-zinc-600 underline">PROTOCOLO OLIVEIRA</button>
            <span class="text-zinc-800 uppercase">Sion V8 Soberana</span>
        </div>
    </div>

    <script>
        function ativarSniper() {
            const input = document.getElementById('ca_input').value;
            const log = document.getElementById('status_sniper');
            if(!input) return;
            log.innerHTML = "<span class='text-blue-500'>[ANALISANDO...]</span> Mapeando liquidez e segurança...";
            setTimeout(() => { log.innerHTML = "<span class='text-green-500'>[CONCLUÍDO]</span> Ativo validado pelo Cerebelo."; }, 2000);
        }

        function processarSaque() {
            const btn = document.getElementById('btn_saque');
            btn.innerHTML = "CONECTANDO REDE SION...";
            setTimeout(() => {
                alert("SUCESSO: $14.85 transferidos para Carteira Mestre.");
                btn.innerHTML = "Liquidar Ativos Agora";
            }, 2000);
        }

        function liberarOliveira() {
            const p = prompt("SENHA VISUAL MESTRE:");
            // Normaliza a senha para evitar erro de espaço ou maiúscula
            if(p.trim().toLowerCase() === "mudaram as estações") {
                alert("ACESSO TOTAL LIBERADO: Bem-vindo, CEO Rayan Silva.");
            } else {
                alert("ACESSO NEGADO: PROTOCOLO DE SEGURANÇA ATIVO.");
            }
        }
    </script>
</body>
</html>
